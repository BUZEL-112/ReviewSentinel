apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prefect-server
  namespace: reviewsentinel
  labels:
    app: prefect-server
    project: reviewsentinel
spec:
  serviceName: prefect-server
  replicas: 1
  selector:
    matchLabels:
      app: prefect-server
  template:
    metadata:
      labels:
        app: prefect-server
        project: reviewsentinel
    spec:
      containers:
        - name: prefect-server
          image: prefecthq/prefect:2-python3.10
          
          command:
            - prefect
            - server
            - start
            - --host
            - "0.0.0.0"
          
          ports:
            - containerPort: 4200
              name: prefect-ui
          
          env:
            - name: PREFECT_SERVER_DATABASE_CONNECTION_URL
              value: "sqlite+aiosqlite:////prefect/prefect.db"
            - name: PREFECT_API_URL
              value: "http://prefect-server:4200/api"
          
          volumeMounts:
            - name: prefect-data
              mountPath: /prefect
          
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4200
            initialDelaySeconds: 30
            periodSeconds: 10
          
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4200
            initialDelaySeconds: 45
            periodSeconds: 30
      
      volumes:
        - name: prefect-data
          persistentVolumeClaim:
            claimName: prefect-data
