apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reviewsentinel-ingress
  namespace: reviewsentinel
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    
    # Enable CORS for the API
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    
    # Rate limiting — 60 requests per minute per IP on the prediction endpoint
    nginx.ingress.kubernetes.io/limit-rps: "1"
    nginx.ingress.kubernetes.io/limit-connections: "10"
  
spec:
  tls:
    - hosts:
        - reviewsentinel.yourdomain.com
      secretName: reviewsentinel-tls    # cert-manager creates this Secret automatically
  
  rules:
    - host: reviewsentinel.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reviewsentinel-api
                port:
                  number: 8000
          
          - path: /mlflow
            pathType: Prefix
            backend:
              service:
                name: mlflow
                port:
                  number: 5000
          
          - path: /prefect
            pathType: Prefix
            backend:
              service:
                name: prefect-server
                port:
                  number: 4200
          
          - path: /monitoring
            pathType: Prefix
            backend:
              service:
                name: reviewsentinel-api
                port:
                  number: 8000
