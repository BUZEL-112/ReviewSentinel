# API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: ghcr.io/buzel-112/reviewsentinel-api:latest
        envFrom:
        - configMapRef:
            name: reviewsentinel-configs
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: reviewsentinel-secrets
              key: MINIO_ROOT_USER
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: reviewsentinel-secrets
              key: MINIO_ROOT_PASSWORD
        ports:
        - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: host-artifacts
          mountPath: /app/artifacts
        - name: host-configs
          mountPath: /app/configs
      volumes:
      - name: host-artifacts
        hostPath:
          path: /artifacts
      - name: host-configs
        hostPath:
          path: /configs
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
---
# SEARCH INDEX BUILDER (Job)
apiVersion: batch/v1
kind: Job
metadata:
  name: search-index-builder
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: search-index-builder
        image: ghcr.io/buzel-112/reviewsentinel-search-index-builder:latest
        envFrom:
        - configMapRef:
            name: reviewsentinel-configs
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: reviewsentinel-secrets
              key: MINIO_ROOT_USER
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: reviewsentinel-secrets
              key: MINIO_ROOT_PASSWORD
        volumeMounts:
        - name: host-data
          mountPath: /app/data
        - name: host-artifacts
          mountPath: /app/artifacts
        - name: host-configs
          mountPath: /app/configs
      volumes:
      - name: host-data
        hostPath:
          path: /data
      - name: host-artifacts
        hostPath:
          path: /artifacts
      - name: host-configs
        hostPath:
          path: /configs
---
# NGINX (NodePort)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: ghcr.io/buzel-112/reviewsentinel-nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: reviewsentinel-nginx
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080  # This matches the extraPortMappings in kind-config.yaml