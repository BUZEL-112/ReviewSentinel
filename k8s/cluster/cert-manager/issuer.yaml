apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
  # ClusterIssuer is cluster-scoped, not namespace-scoped
spec:
  acme:
    # Let's Encrypt production endpoint — use staging first for testing
    server: https://acme-v02.api.letsencrypt.org/directory
    email: your-email@example.com    # sourced from variable — cert expiry notifications go here
    
    privateKeySecretRef:
      # cert-manager stores the ACME account private key in this Secret
      name: letsencrypt-production-account-key
    
    solvers:
      - http01:
          ingress:
            class: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: your-email@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
