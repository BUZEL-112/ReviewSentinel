apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reviewsentinel-api-hpa
  namespace: reviewsentinel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reviewsentinel-api
  
  minReplicas: 2
  maxReplicas: 5
  
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70    # scale up when average CPU across Pods exceeds 70%
    
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60     # wait 60s before scaling up again
      policies:
        - type: Pods
          value: 1                       # add at most 1 Pod at a time
          periodSeconds: 60
    
    scaleDown:
      stabilizationWindowSeconds: 300    # wait 5 minutes before scaling down
      policies:
        - type: Pods
          value: 1                       # remove at most 1 Pod at a time
          periodSeconds: 60
