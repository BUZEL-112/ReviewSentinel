apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviewsentinel-api
  namespace: reviewsentinel
  labels:
    app: reviewsentinel-api
    project: reviewsentinel
    version: "1.0.0"
spec:
  replicas: 2
  
  selector:
    matchLabels:
      app: reviewsentinel-api
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1           # during update, at most 1 extra Pod above desired count
      maxUnavailable: 0     # during update, never go below desired count (zero-downtime)
  
  template:
    metadata:
      labels:
        app: reviewsentinel-api
        project: reviewsentinel
        version: "1.0.0"
    spec:
      # Spread Pods across nodes if cluster scales to multiple nodes
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: reviewsentinel-api
      
      initContainers:
        - name: wait-for-mlflow
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q --spider http://mlflow:5000/health; do
                echo "Waiting for MLflow..."
                sleep 5
              done
      
      containers:
        - name: api
          image: reviewsentinel/api:latest
          
          command:
            - uvicorn
            - scripts.api:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --workers
            - "2"
          
          ports:
            - containerPort: 8000
              name: http
          
          envFrom:
            - configMapRef:
                name: reviewsentinel-config
          
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: reviewsentinel-secrets
                  key: minio-root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: reviewsentinel-secrets
                  key: minio-root-password
          
          volumeMounts:
            - name: artifacts
              mountPath: /app/artifacts
          
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          
          # Graceful shutdown — let in-flight requests complete
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      
      # terminationGracePeriodSeconds is a pod-level field, not container-level
      terminationGracePeriodSeconds: 30
      
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: artifacts-pvc
