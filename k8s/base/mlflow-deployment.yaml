apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker/docker-compose.prod.yaml -o k8s/base/
    kompose.version: 1.31.2 (a92241f79)
  creationTimestamp: null
  labels:
    io.kompose.service: mlflow
  name: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mlflow
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker/docker-compose.prod.yaml -o k8s/base/
        kompose.version: 1.31.2 (a92241f79)
      creationTimestamp: null
      labels:
        io.kompose.network/reviewsentinel-net: "true"
        io.kompose.service: mlflow
    spec:
      containers:
        - env:
            - name: AWS_ACCESS_KEY_ID
              value: reviewsentinel
            - name: AWS_SECRET_ACCESS_KEY
              value: changeme123
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://minio:9000
          image: ghcr.io/buzel-112/reviewsentinel-mlflow:latest
          name: reviewsentinel-mlflow
          ports:
            - containerPort: 5000
              hostPort: 5000
              protocol: TCP
          resources: {}
          volumeMounts:
            - mountPath: /mlflow
              name: mlflow-data
      restartPolicy: Always
      volumes:
        - name: mlflow-data
          persistentVolumeClaim:
            claimName: mlflow-data
status: {}
