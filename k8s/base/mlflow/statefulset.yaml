apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mlflow
  namespace: reviewsentinel
  labels:
    app: mlflow
    project: reviewsentinel
spec:
  serviceName: mlflow
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
        project: reviewsentinel
    spec:
      initContainers:
        # Wait for MinIO to be ready before MLflow starts
        # MLflow connects to MinIO at startup to verify artifact store access
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q --spider http://minio:9000/minio/health/ready; do
                echo "Waiting for MinIO..."
                sleep 5
              done
              echo "MinIO is ready."
      
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.11.3
          
          command:
            - mlflow
            - server
            - --backend-store-uri
            - sqlite:///mlflow/mlflow.db
            - --default-artifact-root
            - s3://reviewsentinel-artifacts/mlflow
            - --host
            - "0.0.0.0"
            - --port
            - "5000"
          
          ports:
            - containerPort: 5000
              name: mlflow-ui
          
          env:
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://minio:9000"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: reviewsentinel-secrets
                  key: minio-root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: reviewsentinel-secrets
                  key: minio-root-password
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
          
          volumeMounts:
            - name: mlflow-data
              mountPath: /mlflow
          
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
          
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
      
      volumes:
        - name: mlflow-data
          persistentVolumeClaim:
            claimName: mlflow-data
