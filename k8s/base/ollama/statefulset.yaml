apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  namespace: reviewsentinel
  labels:
    app: ollama
    project: reviewsentinel
spec:
  serviceName: ollama
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
        project: reviewsentinel
    spec:
      initContainers:
        # Pull Mistral model if not already present in the persistent volume
        - name: pull-mistral
          image: ollama/ollama:0.2.0
          command:
            - sh
            - -c
            - |
              ollama serve &
              sleep 5
              if ! ollama list | grep -q "mistral"; then
                echo "Pulling Mistral model..."
                ollama pull mistral
                echo "Mistral model pulled successfully."
              else
                echo "Mistral model already present, skipping pull."
              fi
              pkill ollama || true
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
      
      containers:
        - name: ollama
          image: ollama/ollama:0.2.0
          
          ports:
            - containerPort: 11434
              name: ollama-api
          
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          
          resources:
            requests:
              cpu: 500m
              memory: 4Gi     # Mistral 7B needs ~4GB RAM for CPU inference
            limits:
              cpu: 2000m
              memory: 6Gi
          
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5    # longer failure window — model loading takes time
          
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 60
            periodSeconds: 30
      
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-data
