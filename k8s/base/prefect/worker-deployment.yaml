apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect-worker
  namespace: reviewsentinel
  labels:
    app: prefect-worker
    project: reviewsentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prefect-worker
  template:
    metadata:
      labels:
        app: prefect-worker
        project: reviewsentinel
    spec:
      initContainers:
        - name: wait-for-prefect-server
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q --spider http://prefect-server:4200/api/health; do
                echo "Waiting for Prefect server..."
                sleep 5
              done
      
      containers:
        - name: prefect-worker
          image: reviewsentinel/api:latest    # your custom image containing flow code
          
          command:
            - prefect
            - worker
            - start
            - --pool
            - local-process-pool
          
          env:
            - name: PREFECT_API_URL
              value: "http://prefect-server:4200/api"
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow:5000"
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://minio:9000"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: reviewsentinel-secrets
                  key: minio-root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: reviewsentinel-secrets
                  key: minio-root-password
            - name: OLLAMA_BASE_URL
              value: "http://ollama:11434"
          
          volumeMounts:
            - name: artifacts
              mountPath: /app/artifacts
          
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi    # training tasks need more memory
      
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: artifacts-pvc
