apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: reviewsentinel
  labels:
    app: minio
    project: reviewsentinel
spec:
  selector:
    app: minio
  ports:
    - name: s3-api
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP
  type: ClusterIP
