apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: reviewsentinel
  labels:
    app: minio
    project: reviewsentinel
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi    # generous allocation — MLflow artifacts can grow
