# MLFLOW
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
spec:
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
      - name: mlflow
        image: ghcr.io/buzel-112/reviewsentinel-mlflow:latest
        envFrom:
        - configMapRef:
            name: reviewsentinel-configs
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: reviewsentinel-secrets
              key: MINIO_ROOT_USER
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: reviewsentinel-secrets
              key: MINIO_ROOT_PASSWORD
        ports:
        - containerPort: 5000
        volumeMounts:
        - name: mlflow-data
          mountPath: /mlflow
      volumes:
      - name: mlflow-data
        persistentVolumeClaim:
          claimName: mlflow-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
---
# PREFECT SERVER
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect-server
spec:
  selector:
    matchLabels:
      app: prefect-server
  template:
    metadata:
      labels:
        app: prefect-server
    spec:
      containers:
      - name: prefect-server
        image: prefecthq/prefect:2-python3.10
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: reviewsentinel-secrets
              key: PREFECT_DB_PASSWORD
        - name: PREFECT_API_DATABASE_CONNECTION_URL
          value: "postgresql+asyncpg://prefect:$(POSTGRES_PASSWORD)@prefect-postgres:5432/prefect"
        - name: PREFECT_API_DATABASE_CONNECTION_TIMEOUT
          value: "20.0"
        - name: PREFECT_SERVER_API_HOST
          value: "0.0.0.0"
        - name: PREFECT_API_URL
          value: "http://prefect-server:4200/api"
        # In K8s, 'args' appends to the image's built-in ENTRYPOINT ["prefect"]
        args: ["prefect", "server", "start", "--host", "0.0.0.0"]
        ports:
        - containerPort: 4200
        
        # Native Kubernetes Liveness Probe
        livenessProbe:
          httpGet:
            path: /api/health
            port: 4200
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
          
        # Native Kubernetes Readiness Probe
        readinessProbe:
          httpGet:
            path: /api/health
            port: 4200
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          
        volumeMounts:
        - name: prefect-data
          mountPath: /root/.prefect
      volumes:
      - name: prefect-data
        persistentVolumeClaim:
          claimName: prefect-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prefect-server
spec:
  selector:
    app: prefect-server
  ports:
    - port: 4200
      targetPort: 4200
---
# PREFECT WORKER (No Service Needed)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect-worker
spec:
  selector:
    matchLabels:
      app: prefect-worker
  template:
    metadata:
      labels:
        app: prefect-worker
    spec:
      initContainers:
      - name: wait-for-work-pool
        image: ghcr.io/buzel-112/reviewsentinel-prefect-worker:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: reviewsentinel-configs
        env:
        - name: PREFECT_API_URL
          value: "http://prefect-server:4200/api"
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Waiting for prefect-server API and work pool initialization..."
            until prefect work-pool inspect default-agent-pool > /dev/null 2>&1; do
              echo "Work pool 'default-agent-pool' not ready. Sleeping 5s..."
              sleep 5
            done
            echo "Work pool is successfully verified!"
      containers:
      - name: prefect-worker
        image: ghcr.io/buzel-112/reviewsentinel-prefect-worker:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: reviewsentinel-configs
        env:
        - name: PREFECT_API_URL
          value: "http://prefect-server:4200/api"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: reviewsentinel-secrets
              key: MINIO_ROOT_USER
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: reviewsentinel-secrets
              key: MINIO_ROOT_PASSWORD
        command: ["/bin/sh", "-c"]
        args: ["prefect worker start --pool default-agent-pool"]
        volumeMounts:
        - name: host-data
          mountPath: /app/data
        - name: host-artifacts
          mountPath: /app/artifacts
        - name: host-configs
          mountPath: /app/configs
      volumes:
      - name: host-data
        hostPath:
          path: /data
      - name: host-artifacts
        hostPath:
          path: /artifacts
      - name: host-configs
        hostPath:
          path: /configs

---
apiVersion: batch/v1
kind: Job
metadata:
  name: prefect-init
spec:
  backoffLimit: 5
  template:
    spec:
      initContainers:
      - name: wait-for-prefect-server
        image: busybox:1.36
        command: ['sh', '-c', 'until wget -qO- http://prefect-server:4200/api/health > /dev/null; do echo "Waiting for Prefect Server to boot..."; sleep 3; done; echo "Server is up!"']
      restartPolicy: OnFailure
      containers:
      - name: prefect-deploy
        image: ghcr.io/buzel-112/reviewsentinel-prefect-worker:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: reviewsentinel-configs
        env:
        - name: PREFECT_API_URL
          value: "http://prefect-server:4200/api"
        command: ["/bin/sh", "-c"]
        args: 
          - |
            set -e;
            echo "Waiting for Prefect Server to initialize..."
            sleep 15;
            prefect work-pool create default-agent-pool --type process || true;
            echo "Registering deployments from prefect.yaml..."
            prefect deploy --all;
            echo "Deployments registered successfully!"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect-postgres
spec:
  selector:
    matchLabels:
      app: prefect-postgres
  template:
    metadata:
      labels:
        app: prefect-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_USER
          value: "prefect"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: reviewsentinel-secrets
              key: PREFECT_DB_PASSWORD
        - name: POSTGRES_DB
          value: "prefect"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: prefect-postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: prefect-postgres-data
        persistentVolumeClaim:
          claimName: prefect-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prefect-postgres
spec:
  selector:
    app: prefect-postgres
  ports:
    - port: 5432
      targetPort: 5432
